<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%235D7052'><path d='M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriSphere AI — Organic Geospatial, Soil & National Agriculture Intelligence</title>
    <meta name="description" content="Unified AI & Remote Sensing Platform combining GeoSR-AI satellite super-resolution mapping, precision soil health forecasting, Power BI national crop analytics, and multilingual AI agronomist advisory." />
    <!-- Google Fonts: Fraunces (Variable Soft Serif) & Nunito (Rounded Sans) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,400..800,0..100;1,9..144,400..800,0..100&family=Nunito:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Leaflet CSS for Precision Land Measurement & Satellite Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
      /* Strictly Hide Top Google Translate Header Bar & Tooltips */
      .goog-te-banner-frame,
      .goog-te-banner-frame.skiptranslate,
      iframe.goog-te-banner-frame,
      iframe.skiptranslate,
      .goog-te-banner,
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0px !important;
        width: 0px !important;
        border: none !important;
        pointer-events: none !important;
        position: absolute !important;
        top: -9999px !important;
        z-index: -9999 !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
      .goog-text-highlight {
        background-color: transparent !important;
        box-shadow: none !important;
        border: none !important;
      }
    </style>
  </head>
  <body class="bg-[#FDFCF8] text-[#2C2C24] font-sans antialiased selection:bg-[#5D7052]/20 selection:text-[#5D7052]">
    <div id="google_translate_element" style="display: none !important; visibility: hidden !important; position: absolute; top: -9999px;"></div>
    <div id="root"></div>
    <script type="text/javascript">
      // Clean stale translation cookies if English is chosen
      (function() {
        try {
          var savedLang = localStorage.getItem('agri_lang');
          if (!savedLang || savedLang === 'en') {
            var domains = ['', window.location.hostname, '.' + window.location.hostname, 'localhost', '.localhost'];
            var paths = ['/', '', '/en', '/en/en'];
            domains.forEach(function(d) {
              paths.forEach(function(p) {
                var dStr = d ? 'domain=' + d + '; ' : '';
                var pStr = p ? 'path=' + p + '; ' : '';
                document.cookie = 'googtrans=; ' + dStr + pStr + 'expires=Thu, 01 Jan 1970 00:00:00 UTC;';
              });
            });
          }
        } catch (_) {}
      })();

      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            includedLanguages: 'hi,te,ta,kn,mr,bn,gu,pa,ml,or,as,es,fr,de',
            autoDisplay: false
          }, 'google_translate_element');
        }
      }

      // Automatically hide Google Translate Top Banner iframe as soon as created
      const suppressGoogleBanner = () => {
        const frames = document.querySelectorAll('.goog-te-banner-frame, iframe.goog-te-banner-frame, iframe.skiptranslate, #goog-gt-tt');
        frames.forEach(f => {
          f.style.display = 'none';
          f.style.visibility = 'hidden';
          f.style.height = '0px';
          f.style.position = 'absolute';
          f.style.top = '-9999px';
        });
        if (document.body && document.body.style.top !== '0px') {
          document.body.style.top = '0px';
        }
      };
      setInterval(suppressGoogleBanner, 80);
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
